# Signed release build. Push a tag v<versionName> (e.g. `git tag -a v0.1.2 -m "Voice Control 0.1.2" && git push --tags`)
# and this builds the per-ABI APKs with the CI key, verifies them and publishes a GitHub release with the
# APKs + R8 mapping, using the CHANGELOG.md section of that version as the notes.
# workflow_dispatch on a tag (`gh workflow run release.yml --ref v0.1.1`) rebuilds and re-publishes that tag;
# on a branch it only builds and verifies, and uploads the files as a workflow artifact (dry run).
# Secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD (docs/SKELETON.md, "CI").
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Version and tag
        id: version
        run: |
          VERSION="$(sed -n 's/^ *versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          [ -n "$VERSION" ] || { echo "::error::can't read versionName from app/build.gradle.kts"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match versionName $VERSION (expected v$VERSION)"
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::not a tag ($GITHUB_REF_NAME): building and verifying only, no release"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          awk -v v="$VERSION" '$0 == "## " v { f = 1; next } f && /^## / { exit } f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || { echo "::error::CHANGELOG.md has no '## $VERSION' section"; exit 1; }
          cat "$RUNNER_TEMP/notes.md"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for s in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!s}" ] || { echo "::error::secret $s is not set"; exit 1; }
          done
          mkdir -p keystore
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/ci-release.jks
          {
            echo "storeFile=keystore/ci-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APKs
        run: ./gradlew :app:assembleRelease -PabiSplits=true --no-daemon

      - name: Verify and rename
        run: scripts/package-release.sh "$GITHUB_WORKSPACE/dist"

      - name: Remove signing key
        if: always()
        run: rm -f keystore.properties keystore/ci-release.jks

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: voice-control-${{ steps.version.outputs.version }}
          path: |
            dist/*.apk
            dist/mapping-*.txt
          if-no-files-found: error

      - name: Publish GitHub release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Voice Control ${{ steps.version.outputs.version }}
          body_path: ${{ runner.temp }}/notes.md
          files: |
            dist/voice-control-${{ steps.version.outputs.version }}-*-release.apk
            dist/mapping-${{ steps.version.outputs.version }}.txt
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
